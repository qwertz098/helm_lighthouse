{% extends "base.html" %}
{% set active = "dashboard" %}
{% block title %}Dashboard — Helm{% endblock %}

{% block content %}
<div class="flex items-center justify-between" style="margin-bottom:20px">
  <h1 class="page-title">Dashboard</h1>
  <div class="flex gap-2">
    <button class="btn btn-secondary btn-sm"
            hx-get="/dashboard/raw"
            hx-target="#raw-panel"
            hx-swap="innerHTML"
            onclick="document.getElementById('raw-panel').style.display=''">
      📋 Edit raw YAML
    </button>
    <button class="btn btn-primary btn-sm"
            onclick="document.getElementById('add-form').style.display=
              document.getElementById('add-form').style.display==='none'?'':'none'">
      + Add entry
    </button>
  </div>
</div>

<!-- Add entry form -->
<div id="add-form" style="display:none;margin-bottom:16px">
  <div class="card">
    <div class="card-header"><strong>New entry</strong></div>
    <div class="card-body">
      <form hx-post="/dashboard/entries"
            hx-target="#tiles-container"
            hx-swap="innerHTML"
            onsubmit="setTimeout(()=>document.getElementById('add-form').style.display='none',100)"
            style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:end">
        <div class="form-group">
          <label class="form-label">Name</label>
          <input class="form-control" name="name" placeholder="My Device" required>
        </div>
        <div class="form-group" style="grid-column:span 2">
          <label class="form-label">URL</label>
          <input class="form-control" name="url" placeholder="http://192.168.1.x" required>
        </div>
        <div class="form-group">
          <label class="form-label">Type</label>
          <select class="form-control" name="type" onchange="onAddTypeChange(this)">
            <option value="link">Link</option>
            <option value="camera">Camera (MJPEG)</option>
            <option value="video">Video (MP4)</option>
            <option value="chart">Chart (Embed/iframe)</option>
            <option value="vnc">VNC (noVNC)</option>
            <option value="rdp">RDP (Guacamole)</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Group</label>
          <input class="form-control" name="group" placeholder="Network">
        </div>
        <div class="form-group">
          <label class="form-label">Username</label>
          <input class="form-control" name="username">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input class="form-control" type="password" name="password">
        </div>
        <div class="form-group">
          <label class="form-label">Remarks</label>
          <input class="form-control" name="remarks">
        </div>
        <div class="form-group" style="grid-column:span 2" id="add-bg-row">
          <label class="form-label">Background image URL <span style="color:#94a3b8;font-weight:400">(cached &amp; resized locally)</span></label>
          <input class="form-control" name="bg_image" placeholder="https://…/photo.jpg">
        </div>
        <div class="form-group" style="grid-column:span 4;display:none" id="add-views-row">
          <label class="form-label">Chart views <span style="color:#94a3b8;font-weight:400">(optional — one per line: <code>Label|URL</code>)</span></label>
          <textarea class="form-control" name="chart_views" rows="3" placeholder="Last 1 h|http://192.168.1.1:8000/chart/embed/abc/?from=now-1h&#10;Last 24 h|http://192.168.1.1:8000/chart/embed/abc/?from=now-24h"></textarea>
        </div>
        <input type="hidden" name="icon" value="">
        <div style="grid-column:span 4;display:flex;gap:8px">
          <button type="submit" class="btn btn-primary btn-sm">Add</button>
          <button type="button" class="btn btn-secondary btn-sm"
                  onclick="document.getElementById('add-form').style.display='none'">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Raw YAML panel -->
<div id="raw-panel" style="display:none;margin-bottom:16px"></div>

<!-- Tiles -->
<div id="tiles-container">
  {% include "dashboard/_tiles.html" %}
</div>
{% endblock %}

{% block scripts %}
<script>
function onAddTypeChange(sel) {
  const isChart = sel.value === 'chart';
  document.getElementById('add-views-row').style.display = isChart ? '' : 'none';
  document.getElementById('add-bg-row').style.display = isChart ? 'none' : '';
}

function el(tag, props = {}, ...children) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
}

function streamError(text) {
  return el('div', { className: 'stream-error', textContent: '⚠ ' + text });
}

// Sandbox only matters for same-origin embeds: those could otherwise reach into Helm.
// Cross-origin embeds keep their own origin so their cookies/storage keep working.
function mountFrame(frame, url) {
  let sameOrigin = true;
  try { sameOrigin = new URL(url, location.href).origin === location.origin; } catch (_) {}
  frame.setAttribute('sandbox', sameOrigin
    ? 'allow-scripts allow-forms'
    : 'allow-scripts allow-same-origin allow-forms allow-popups');
  frame.src = url;
}

function openOverlay(name, media) {
  const overlay = el('div', { className: 'media-overlay' },
    el('div', { className: 'media-overlay-bar' },
      el('span', { textContent: name }),
      el('button', { type: 'button', textContent: '✕ Schließen', onclick: () => overlay.remove() })),
    media);
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
}

function openEmbed(url, name) {
  const frame = el('iframe', { className: 'media-overlay-frame' });
  mountFrame(frame, url);
  openOverlay(name, frame);
}

function openCamera(url, name) {
  const img = el('img', { className: 'media-overlay-media', src: url });
  img.onerror = () => img.replaceWith(streamError('Stream not reachable'));
  openOverlay(name, img);
}

function openVideo(url, name) {
  const video = el('video', { className: 'media-overlay-media', src: url,
                              autoplay: true, muted: true, loop: true, playsInline: true, controls: true });
  video.onerror = () => video.replaceWith(streamError('Video not reachable'));
  openOverlay(name, video);
}

function initFrames(root) {
  root.querySelectorAll('iframe.embed-frame[data-src]').forEach(f => {
    mountFrame(f, f.dataset.src);
    f.removeAttribute('data-src');
  });
}

const tiles = document.getElementById('tiles-container');
initFrames(tiles);

tiles.addEventListener('click', e => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const tile = btn.closest('.tile');
  const { url, name } = tile.dataset;
  switch (btn.dataset.action) {
    case 'details': {
      const details = tile.querySelector('.tile-details');
      const open = details.style.display === 'none';
      details.style.display = open ? '' : 'none';
      btn.textContent = open ? '−' : '＋';
      btn.title = open ? 'Collapse details' : 'Expand details';
      break;
    }
    case 'view':
      mountFrame(tile.querySelector('iframe.embed-frame'), btn.dataset.viewUrl);
      tile.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b === btn));
      break;
    case 'embed':  openEmbed(url, name);  break;
    case 'camera': openCamera(url, name); break;
    case 'video':  openVideo(url, name);  break;
  }
});

// After an edit PUT, re-init frames and bust the edited tile's thumbnail cache
let _lastEditedTileId = null;
document.body.addEventListener('htmx:beforeRequest', e => {
  const m = (e.detail.requestConfig?.path || '').match(/\/dashboard\/entries\/([^/]+)$/);
  if (m && e.detail.requestConfig.verb === 'put') _lastEditedTileId = m[1];
});
document.body.addEventListener('htmx:afterSwap', e => {
  if (e.detail.target?.id !== 'tiles-container') return;
  initFrames(e.detail.target);
  if (!_lastEditedTileId) return;
  const img = document.getElementById('tile-' + _lastEditedTileId)?.querySelector('img.link-thumb');
  if (img) img.src = img.src.split('&t=')[0] + '&t=' + Date.now();
  _lastEditedTileId = null;
});
</script>
{% endblock %}
